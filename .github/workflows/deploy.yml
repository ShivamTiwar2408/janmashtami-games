name: Deploy to Vercel

# Auto-deploys to production on every push to main.
# Requires three repository secrets (Settings → Secrets and variables → Actions):
#   VERCEL_TOKEN       – a token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID      – from .vercel/project.json after running `vercel link`
#   VERCEL_PROJECT_ID  – from .vercel/project.json after running `vercel link`

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # CRA (react-scripts) treats lint warnings as errors when CI=true, which
      # GitHub Actions sets automatically. The repo has pre-existing warnings,
      # so disable that here (same effect as vercel.json for the remote build).
      CI: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
